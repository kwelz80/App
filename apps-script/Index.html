<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root {
  --bg: #16130f;
  --paper: #1d1a15;
  --ink: #efe6d4;
  --muted: #8b8272;
  --accent: #e0a85a;
  --line: #2c2820;
}
body[data-theme="light"] {
  --bg: #e9e4d8;
  --paper: #f8f4ea;
  --ink: #231f18;
  --muted: #7a7262;
  --accent: #9a5b14;
  --line: #d9d1bf;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
}

#bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  transition: opacity .4s;
}
body.typing #bar { opacity: .15; }
body.typing #bar:hover { opacity: 1; }
#bar .left, #bar .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { color: var(--accent); letter-spacing: .04em; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }

button {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 12px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }

#stage { flex: 1; display: flex; min-height: 0; }

#welcome {
  margin: auto;
  max-width: 560px;
  padding: 24px 16px;
  text-align: center;
}
#welcome h1 { font-family: "Courier New", monospace; font-weight: 400; font-size: 32px; }
#welcome .actions { display: flex; flex-direction: column; gap: 10px; margin: 24px auto; max-width: 320px; }

#paper {
  flex: 1;
  display: flex;
  justify-content: center;
  background: var(--paper);
  min-height: 0;
}
#editor {
  width: 100%;
  max-width: 720px;
  height: 100%;
  padding: 45vh 16px;
  background: transparent;
  color: var(--ink);
  border: 0;
  outline: none;
  resize: none;
  font-size: 20px;
  line-height: 1.7;
  caret-color: var(--accent);
}
body[data-font="mono"] #editor { font-family: "Courier Prime", "Courier New", Courier, monospace; }
body[data-font="serif"] #editor { font-family: Georgia, "Times New Roman", serif; }
body[data-font="sans"] #editor { font-family: system-ui, sans-serif; }

/* Focus fade: mask everything above the bottom line */
body.focus #editor {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.25) 30%, #000 47%, #000 55%, rgba(0,0,0,.25) 70%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.25) 30%, #000 47%, #000 55%, rgba(0,0,0,.25) 70%, transparent 100%);
}

dialog {
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  width: min(420px, calc(100vw - 32px));
}
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0; }
dialog label input[type=checkbox] { order: -1; }
dialog label:has(input[type=checkbox]) { justify-content: flex-start; }
dialog select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 0; margin-top: 20px; }
.panel { text-align: left; margin: 18px auto; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
.panel label { font-size: 14px; color: var(--muted); }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
input[type=text] { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 14px; }
input[type=text]:focus { outline: none; border-color: var(--accent); }
#recent { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
#recent button { text-align: left; border: 0; padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#recent .muted { font-size: 12px; padding-left: 8px; }
button.link { border: 0; color: var(--muted); text-decoration: underline; margin-top: 12px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body data-theme="dark" data-font="mono">
<header id="bar">
  <div class="left">
    <strong class="brand">Draftline</strong>
    <span id="docName" class="muted">No doc selected</span>
  </div>
  <div class="right">
    <span id="status" class="muted"></span>
    <span id="wordCount" class="muted">0 words</span>
    <button id="btnHome" title="Pick a different doc" hidden>Change doc</button>
    <button id="btnSettings" title="Settings">Settings</button>
    <span id="who" class="muted small"></span>
  </div>
</header>

<main id="stage">
  <section id="welcome">
    <h1>Write one line at a time.</h1>
    <p>Pick a Google Doc and type. Your words go straight into that doc.</p>

    <div class="panel">
      <label for="newTitle">Start a new Google Doc</label>
      <div class="row">
        <input id="newTitle" type="text" placeholder="Name your doc">
        <button id="btnNew">Create</button>
      </div>
    </div>

    <div class="panel">
      <label for="docLink">Open a Google Doc you already have</label>
      <div class="row">
        <input id="docLink" type="text" placeholder="Paste the doc's link">
        <button id="btnOpen">Open</button>
      </div>
      <div id="recent"></div>
    </div>

    <button id="btnLocal" class="link">Write without saving to Google</button>
  </section>

  <section id="paper" hidden>
    <textarea id="editor" spellcheck="true" autocomplete="off" placeholder="Start typing..."></textarea>
  </section>
</main>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label><input type="checkbox" id="optSound" checked> Key sounds</label>
    <label><input type="checkbox" id="optForward"> Forward-only mode (no backspace, no going back)</label>
    <label><input type="checkbox" id="optFocus" checked> Fade everything but the current line</label>
    <label>Theme
      <select id="optTheme">
        <option value="dark">Night</option>
        <option value="light">Paper</option>
      </select>
    </label>
    <label>Font
      <select id="optFont">
        <option value="mono">Typewriter</option>
        <option value="serif">Serif</option>
        <option value="sans">Sans</option>
      </select>
    </label>
    <label>Autosave every
      <select id="optSave">
        <option value="5">5 seconds</option>
        <option value="15" selected>15 seconds</option>
        <option value="60">1 minute</option>
      </select>
    </label>
    <menu>
      <button id="btnSaveNow" type="button">Save now</button>
      <button value="close">Close</button>
    </menu>
  </form>
</dialog>

<script>
(() => {
  "use strict";
  const LS = { settings: "draftline.settings", draft: "draftline.localDraft" };
  const $ = (id) => document.getElementById(id);
  const el = {
    body: document.body, editor: $("editor"), paper: $("paper"), welcome: $("welcome"),
    docName: $("docName"), status: $("status"), words: $("wordCount"), who: $("who"),
    home: $("btnHome"), newTitle: $("newTitle"), newDoc: $("btnNew"), link: $("docLink"),
    open: $("btnOpen"), recent: $("recent"), local: $("btnLocal"),
    settingsBtn: $("btnSettings"), settings: $("settings"), saveNow: $("btnSaveNow"),
    optSound: $("optSound"), optForward: $("optForward"), optFocus: $("optFocus"),
    optTheme: $("optTheme"), optFont: $("optFont"), optSave: $("optSave"),
  };

  const store = {
    get(k, f) { try { const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // google.script.run as a promise
  const server = (fn, ...args) => new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));

  /* ---------- settings ---------- */
  const settings = Object.assign(
    { sound: true, forward: false, focus: true, theme: "dark", font: "mono", save: 15 },
    store.get(LS.settings, {})
  );
  function applySettings() {
    el.optSound.checked = settings.sound;
    el.optForward.checked = settings.forward;
    el.optFocus.checked = settings.focus;
    el.optTheme.value = settings.theme;
    el.optFont.value = settings.font;
    el.optSave.value = String(settings.save);
    el.body.dataset.theme = settings.theme;
    el.body.dataset.font = settings.font;
    el.body.classList.toggle("focus", settings.focus);
    store.set(LS.settings, settings);
    restartAutosave();
  }
  el.optSound.onchange = () => { settings.sound = el.optSound.checked; applySettings(); };
  el.optForward.onchange = () => { settings.forward = el.optForward.checked; applySettings(); moveCaretToEnd(); };
  el.optFocus.onchange = () => { settings.focus = el.optFocus.checked; applySettings(); };
  el.optTheme.onchange = () => { settings.theme = el.optTheme.value; applySettings(); };
  el.optFont.onchange = () => { settings.font = el.optFont.value; applySettings(); };
  el.optSave.onchange = () => { settings.save = Number(el.optSave.value); applySettings(); };
  el.settingsBtn.onclick = () => el.settings.showModal();

  /* ---------- sound ---------- */
  let audio = null;
  function ctx() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    return audio;
  }
  function noiseBurst(ac, { dur, freq, q, gain, when = 0 }) {
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
    const g = ac.createGain(); g.gain.value = gain;
    src.connect(bp).connect(g).connect(ac.destination);
    src.start(ac.currentTime + when);
  }
  function tone(ac, { freq, dur, gain, when = 0 }) {
    const o = ac.createOscillator(); const g = ac.createGain();
    o.type = "sine"; o.frequency.value = freq;
    const t = ac.currentTime + when;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  const sound = {
    key() { const ac = ctx(); noiseBurst(ac, { dur: 0.035, freq: 2200 + Math.random() * 1600, q: 1.2, gain: 0.9 }); noiseBurst(ac, { dur: 0.02, freq: 350, q: 0.8, gain: 0.6 }); },
    space() { noiseBurst(ctx(), { dur: 0.05, freq: 900, q: 0.9, gain: 0.9 }); },
    back() { noiseBurst(ctx(), { dur: 0.03, freq: 1400, q: 1, gain: 0.5 }); },
    returnKey() { const ac = ctx(); tone(ac, { freq: 2093, dur: 0.9, gain: 0.12 }); noiseBurst(ac, { dur: 0.28, freq: 600, q: 0.5, gain: 0.5, when: 0.05 }); noiseBurst(ac, { dur: 0.05, freq: 300, q: 0.7, gain: 0.9, when: 0.32 }); },
  };

  /* ---------- editor ---------- */
  const NAV_KEYS = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown", "Backspace", "Delete"]);
  function moveCaretToEnd() {
    const n = el.editor.value.length;
    el.editor.setSelectionRange(n, n);
    el.editor.scrollTop = el.editor.scrollHeight;
  }
  el.editor.addEventListener("keydown", (e) => {
    if (settings.forward && (NAV_KEYS.has(e.key) || ((e.ctrlKey || e.metaKey) && /^[zxya]$/i.test(e.key)))) { e.preventDefault(); return; }
    el.body.classList.add("typing");
    if (!settings.sound || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter") sound.returnKey();
    else if (e.key === " ") sound.space();
    else if (e.key === "Backspace" || e.key === "Delete") sound.back();
    else if (e.key.length === 1) sound.key();
  });
  el.editor.addEventListener("beforeinput", (e) => {
    if (!settings.forward) return;
    if (e.inputType.startsWith("delete") || e.inputType.startsWith("history")) e.preventDefault();
    else moveCaretToEnd();
  });
  ["mouseup", "focus", "select"].forEach((ev) =>
    el.editor.addEventListener(ev, () => { if (settings.forward) setTimeout(moveCaretToEnd, 0); }));
  el.editor.addEventListener("input", () => {
    if (el.editor.selectionStart === el.editor.value.length) el.editor.scrollTop = el.editor.scrollHeight;
    updateWordCount();
    if (doc) dirty = true; else store.set(LS.draft, el.editor.value);
  });
  document.addEventListener("mousemove", () => el.body.classList.remove("typing"));

  function updateWordCount() {
    const n = (el.editor.value.trim().match(/\S+/g) || []).length;
    el.words.textContent = `${n} word${n === 1 ? "" : "s"}`;
  }
  function showPaper(text) {
    el.editor.value = text;
    updateWordCount();
    el.welcome.hidden = true;
    el.paper.hidden = false;
    el.home.hidden = false;
    el.editor.focus();
    moveCaretToEnd();
  }
  function showWelcome() {
    el.paper.hidden = true;
    el.home.hidden = true;
    el.welcome.hidden = false;
    el.docName.textContent = "No doc selected";
    el.words.textContent = "";
  }
  function setStatus(msg) { el.status.textContent = msg; }
  function busy(on) { [el.newDoc, el.open].forEach((b) => (b.disabled = on)); }

  /* ---------- docs ---------- */
  let doc = null;
  let dirty = false;
  let saving = false;

  async function begin(promise) {
    try {
      if (doc && dirty) await save();
      busy(true);
      setStatus("Opening...");
      doc = await promise;
      dirty = false;
      el.docName.textContent = doc.title;
      setStatus(doc.empty ? "Ready" : "New writing goes at the end of this doc");
      showPaper("");
      refreshRecent();
    } catch (e) {
      setStatus(friendly(e));
    } finally {
      busy(false);
    }
  }

  el.newDoc.onclick = () => begin(server("createDoc", el.newTitle.value.trim() || `Draft ${new Date().toLocaleDateString()}`));
  el.newTitle.onkeydown = (e) => { if (e.key === "Enter") el.newDoc.click(); };
  el.open.onclick = () => { if (el.link.value.trim()) begin(server("openDoc", el.link.value.trim())); };
  el.link.onkeydown = (e) => { if (e.key === "Enter") el.open.click(); };
  el.local.onclick = async () => {
    if (doc && dirty) await save();
    doc = null;
    el.docName.textContent = "Local draft (only in this browser)";
    setStatus("");
    showPaper(store.get(LS.draft, ""));
  };
  el.home.onclick = async () => { if (doc && dirty) await save(); doc = null; showWelcome(); };

  async function save() {
    if (!doc || saving || !dirty) return;
    saving = true;
    dirty = false;
    try {
      setStatus("Saving...");
      const state = await server("saveText", doc, el.editor.value);
      // Keep fields from the server, but don't clobber a newer doc switch.
      if (doc && doc.id === state.id) Object.assign(doc, state);
      if (state.moved) setStatus("Doc changed elsewhere. Continuing at the end.");
      else setStatus(`Saved ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`);
    } catch (e) {
      dirty = true;
      setStatus(`Save failed: ${friendly(e)}`);
    } finally {
      saving = false;
    }
  }
  el.saveNow.onclick = () => { if (doc) { dirty = true; save(); } };

  let autosaveTimer = null;
  function restartAutosave() { clearInterval(autosaveTimer); autosaveTimer = setInterval(save, settings.save * 1000); }
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
  window.addEventListener("beforeunload", (e) => { if (doc && (dirty || saving)) { save(); e.preventDefault(); e.returnValue = ""; } });

  function friendly(e) {
    const m = (e && e.message) || String(e);
    if (/not found|Requested entity/i.test(m)) return "Couldn't find that doc. Check the link.";
    if (/permission|forbidden/i.test(m)) return "You don't have edit access to that doc.";
    return m;
  }

  /* ---------- recent docs ---------- */
  let recent = [];
  function renderRecent() {
    el.recent.innerHTML = "";
    if (!recent.length) return;
    const h = document.createElement("span");
    h.className = "muted"; h.textContent = "Recent";
    el.recent.append(h);
    recent.forEach((r) => {
      const b = document.createElement("button");
      b.textContent = r.title || "Untitled";
      b.onclick = () => begin(server("openDoc", r.id));
      el.recent.append(b);
    });
  }
  function refreshRecent() {
    server("getUser").then((u) => { recent = u.recent || []; renderRecent(); }).catch(() => {});
  }

  /* ---------- boot ---------- */
  applySettings();
  server("getUser")
    .then((u) => { el.who.textContent = u.email || ""; recent = u.recent || []; renderRecent(); })
    .catch((e) => setStatus(friendly(e)));
})();
</script>
</body>
</html>
